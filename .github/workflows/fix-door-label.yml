name: Fix Door Label

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only the displayed Door label
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/app/workshop/[jobId]/documents/page.tsx')
          s = p.read_text(encoding='utf-8')
          old = "  shelf: 'رف',\n}[partType] ?? partType);"
          new = "  shelf: 'رف',\n  door: 'باب',\n}[partType] ?? partType);"
          if old not in s:
              raise SystemExit('Expected label map was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/app/workshop/[jobId]/documents/page.tsx'
          git rm '.github/workflows/fix-door-label.yml'
          git commit -m 'Fix displayed door label to Arabic'
          git push
